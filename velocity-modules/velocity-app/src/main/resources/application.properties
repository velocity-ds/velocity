# Load local values automatically; process environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

# Shared section order: application/storage, inference, Slack, agent features, feature modules.
# Within features: switches/provider first, then settings alphabetically by application property.
# Keep related settings together in this file, .env.example and .env.
#
# Defaults for the settings below live only in this file; the matching *Properties records declare none.
# Write ${VAR:default} and keep VAR as the environment variable name. A ${VAR} without a default is read
# only when its provider or feature is active.

# Application and server
# The agent operator API authenticates the actual peer socket; proxies cannot grant authority.
server.forward-headers-strategy=${SERVER_FORWARDHEADERSSTRATEGY:none}
server.port=${SERVER_PORT:8090}
spring.application.name=${SPRING_APPLICATION_NAME:velocity}

# Observability (docs/observability.md)
# Actuator lives under the protected /api/operator root, so health, metrics and the Prometheus scrape endpoint
# are reachable only over the same loopback boundary as the console. Health details are shown because the
# boundary already restricts readers to the local operator.
management.endpoints.web.base-path=${MANAGEMENT_ENDPOINTS_WEB_BASEPATH:/api/operator/actuator}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS:always}
management.endpoint.health.show-components=${MANAGEMENT_ENDPOINT_HEALTH_SHOWCOMPONENTS:always}
management.metrics.tags.application=${spring.application.name}
# Every worker and tool log line names its execution; the field is empty outside task work.
logging.pattern.level=%5p [executionId=%X{executionId:-}]

# Application time
# IANA zone of the application clock, of schedule and monitoring defaults, of timestamps shown in the console and
# of the zone named in prompts. Empty uses the machine's zone. Applied before logging and JSON mapping start, and
# the JVM default zone is set to match, so log timestamps below use it too.
app.time-zone=${APP_TIME_ZONE:}
logging.pattern.dateformat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# MongoDB and JobRunr
jobrunr.database.database-name=${JOBRUNR_DATABASE_DATABASENAME:velocity}
spring.mongodb.representation.uuid=${SPRING_MONGODB_REPRESENTATION_UUID:standard}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/velocity}

# Inference provider
# Empty disables default inference and ordinary agent tasks.
# Explicit supported choices: claude, openai, llama-cpp. Cloud continuation is configured separately (inference.cloud-fallback.*).
inference.provider=${INFERENCE_PROVIDER:}

# Shared by root, delegated, attachment, learning, playground and fallback inference.
inference.concurrency.max-requests=${INFERENCE_CONCURRENCY_MAX_REQUESTS:4}
inference.concurrency.queue-capacity=${INFERENCE_CONCURRENCY_QUEUE_CAPACITY:100}
inference.concurrency.max-wait-millis=${INFERENCE_CONCURRENCY_MAX_WAIT_MILLIS:30000}

# Inference request limits
# Explicit default profile request admission settings; bound only when a provider is selected.
# Set zero capacity explicitly when no model context capacity is declared.
# Built-in providers use native input-token counts plus 2048 tokens of headroom.
# Input admission is distinct from the total task token budget.
inference.primary.context-capacity=${INFERENCE_PRIMARY_CONTEXT_CAPACITY}
inference.primary.input-allowance=${INFERENCE_PRIMARY_INPUT_ALLOWANCE}
inference.primary.safety-margin=${INFERENCE_PRIMARY_SAFETY_MARGIN}

# Inference cloud continuation
# Optional one-way continuation for newly admitted local tasks exceeding their input allowance.
# Disabled settings are not bound/validated and do not construct a hosted SDK client.
# Select exactly one hosted provider (openai or claude) and its model; normal API billing applies.
inference.cloud-fallback.enabled=${INFERENCE_CLOUD_FALLBACK_ENABLED:true}
inference.cloud-fallback.provider=${INFERENCE_CLOUD_FALLBACK_PROVIDER:}
inference.cloud-fallback.context-capacity=${INFERENCE_CLOUD_FALLBACK_CONTEXT_CAPACITY}
inference.cloud-fallback.input-allowance=${INFERENCE_CLOUD_FALLBACK_INPUT_ALLOWANCE}
inference.cloud-fallback.model=${INFERENCE_CLOUD_FALLBACK_MODEL:}
inference.cloud-fallback.output-reserve=${INFERENCE_CLOUD_FALLBACK_OUTPUT_RESERVE}
inference.cloud-fallback.safety-margin=${INFERENCE_CLOUD_FALLBACK_SAFETY_MARGIN}

# Claude inference
# The hosted SDK receives ANTHROPIC_API_KEY only when this provider is selected.
inference.claude.max-tokens=${CLAUDE_MAX_TOKENS}
inference.claude.model=${CLAUDE_MODEL}
# Cache breakpoints on the system prompt, tool definitions and latest turn; cached reads are priced separately.
inference.claude.prompt-caching=${CLAUDE_PROMPT_CACHING:true}

# OpenAI inference
# The hosted SDK receives OPENAI_API_KEY only when this provider is selected.
inference.openai.max-tokens=${OPENAI_MAX_TOKENS}
inference.openai.model=${OPENAI_MODEL}

# llama.cpp inference
# Requires a deliberately configured llama-server with /v1/responses support.
inference.llama-cpp.api-key=${LLAMA_CPP_API_KEY}
inference.llama-cpp.base-url=${LLAMA_CPP_BASE_URL}
inference.llama-cpp.max-tokens=${LLAMA_CPP_MAX_TOKENS}
inference.llama-cpp.model=${LLAMA_CPP_MODEL}

# Slack connection
# Optional Slack Socket Mode connection. Install the Slack app before enabling.
slack.enabled=${SLACK_ENABLED:false}
slack.app-token=${SLACK_APP_TOKEN:}
slack.bot-name=${SLACK_BOT_NAME:Velocity}
slack.bot-token=${SLACK_BOT_TOKEN:}
slack.queue-capacity=${SLACK_QUEUECAPACITY:100}
slack.workers=${SLACK_WORKERS:4}

# Agent execution
agent.concurrency.max-active-roots=${AGENT_CONCURRENCY_MAX_ACTIVE_ROOTS:4}
agent.concurrency.queue-capacity=${AGENT_CONCURRENCY_QUEUE_CAPACITY:100}
agent.automatic-resumption=${AGENT_AUTOMATIC_RESUMPTION:true}
agent.limits.active-millis=${AGENT_LIMITS_ACTIVEMILLIS:1800000}
agent.limits.model-turns=${AGENT_LIMITS_MODELTURNS:150}
agent.limits.output-preview-chars=${AGENT_LIMITS_OUTPUTPREVIEWCHARS:24576}
agent.limits.task-token-ceiling=${AGENT_LIMITS_TASK_TOKEN_CEILING:5000000}
agent.limits.tool-calls=${AGENT_LIMITS_TOOLCALLS:100}
agent.limits.tool-timeout-millis=${AGENT_LIMITS_TOOLTIMEOUTMILLIS:30000}
agent.limits.total-tokens=${AGENT_LIMITS_TOTALTOKENS:470000}

# Local account
# The console and the operator API act as one fixed account. Leave both blank for a console-only account, or set
# the Slack workspace (T...) and user (U...) IDs of the installation's owner so that person's Slack messages and the
# console share tasks, knowledge, schedules, memory and skills. Set both or neither; the account record is created
# on first use. Changing the values later selects a different account; it does not migrate data.
agent.local-account.slack-workspace-id=${AGENT_LOCAL_ACCOUNT_SLACK_WORKSPACE_ID:}
agent.local-account.slack-user-id=${AGENT_LOCAL_ACCOUNT_SLACK_USER_ID:}

# Agent scheduling
# Agent admission and the JobRunr background worker have independent switches.
agent.scheduling.enabled=${AGENT_SCHEDULING_ENABLED:true}
agent.scheduling.maximum-lateness=${AGENT_SCHEDULING_MAXIMUM_LATENESS:60s}

# Browser tools
# Install runtime/browser-use-runtime's pinned Python and locked Node/Chromium dependencies before use.
agent.browser.enabled=${AGENT_BROWSER_ENABLED:true}
agent.browser.headless=${AGENT_BROWSER_HEADLESS:false}
agent.browser.node-executable=${AGENT_BROWSER_NODE_EXECUTABLE:node}
agent.browser.python-executable=${AGENT_BROWSER_PYTHON_EXECUTABLE:python}
agent.browser.launcher-script=${AGENT_BROWSER_LAUNCHER_SCRIPT:runtime/browser-use-runtime/launch.cjs}
# Exact hosts only; empty permits public destinations. No wildcard or suffix matching.
agent.browser.allowed-hosts=${AGENT_BROWSER_ALLOWED_HOSTS:}
# Exact HTTP(S) origins granting private-network access, including any nondefault port.
agent.browser.private-origins=${AGENT_BROWSER_PRIVATE_ORIGINS:}

# Delegation
# Internal child runs share the original task's capacity and ownership.
agent.delegation.enabled=${AGENT_DELEGATION_ENABLED:true}
agent.delegation.max-aggregate-state-bytes=${AGENT_DELEGATION_MAX_AGGREGATE_STATE_BYTES:2097152}
agent.delegation.max-child-state-bytes=${AGENT_DELEGATION_MAX_CHILD_STATE_BYTES:262144}
agent.delegation.max-children=${AGENT_DELEGATION_MAX_CHILDREN:8}
agent.delegation.max-context-chars=${AGENT_DELEGATION_MAX_CONTEXT_CHARS:8000}
agent.delegation.max-objective-chars=${AGENT_DELEGATION_MAX_OBJECTIVE_CHARS:4000}
agent.delegation.max-references=${AGENT_DELEGATION_MAX_REFERENCES:32}
agent.delegation.max-result-bytes=${AGENT_DELEGATION_MAX_RESULT_BYTES:8192}

# History search
agent.history.search-enabled=${AGENT_HISTORY_SEARCH_ENABLED:true}
agent.history.maximum-indexed-executions-per-pass=${AGENT_HISTORY_MAXIMUM_INDEXED_EXECUTIONS_PER_PASS:200}
agent.history.maximum-indexed-message-chars=${AGENT_HISTORY_MAXIMUM_INDEXED_MESSAGE_CHARS:16000}

# Knowledge writes
# data_save, data_update and data_delete pause for the requester's confirmation with a preview of the exact
# change (Slack buttons or the console) whether or not agent.approval.enabled is set. Unattended work
# (scheduled occurrences, delegated children) has no one to ask and runs them directly.
agent.knowledge.confirm-writes=${AGENT_KNOWLEDGE_CONFIRM_WRITES:true}

# Memory
# Persistent memory; generic knowledge remains independently available.
agent.memory.enabled=${AGENT_MEMORY_ENABLED:true}
agent.memory.environment-enabled=${AGENT_MEMORY_ENVIRONMENT_ENABLED:true}
agent.memory.user-enabled=${AGENT_MEMORY_USER_ENABLED:true}
agent.memory.environment-max-chars=${AGENT_MEMORY_ENVIRONMENT_MAX_CHARS:2200}
agent.memory.max-proposals=${AGENT_MEMORY_MAX_PROPOSALS:32}
agent.memory.max-receipts=${AGENT_MEMORY_MAX_RECEIPTS:1024}
agent.memory.max-writes-per-execution=${AGENT_MEMORY_MAX_WRITES_PER_EXECUTION:6}
agent.memory.user-max-chars=${AGENT_MEMORY_USER_MAX_CHARS:1500}
# Derived user profile: model-inferred, written only by background profile reviews.
agent.memory.profile-enabled=${AGENT_MEMORY_PROFILE_ENABLED:true}
agent.memory.profile-max-chars=${AGENT_MEMORY_PROFILE_MAX_CHARS:1500}

# Skills
agent.skills.enabled=${AGENT_SKILLS_ENABLED:true}
agent.skills.maximum-core-chars=${AGENT_SKILLS_MAXIMUM_CORE_CHARS:6000}
agent.skills.maximum-index-chars=${AGENT_SKILLS_MAXIMUM_INDEX_CHARS:12000}
agent.skills.maximum-reference-chars=${AGENT_SKILLS_MAXIMUM_REFERENCE_CHARS:6000}
agent.skills.maximum-skills=${AGENT_SKILLS_MAXIMUM_SKILLS:20}
agent.skills.retained-versions=${AGENT_SKILLS_RETAINED_VERSIONS:6}
# One extra model turn before a task's answer is delivered, so a loaded skill can be patched.
agent.skills.self-check-enabled=${AGENT_SKILLS_SELF_CHECK_ENABLED:true}

# Learning
agent.learning.enabled=${AGENT_LEARNING_ENABLED:true}
agent.learning.worker-enabled=${AGENT_LEARNING_WORKER_ENABLED:true}
# Facts are reviewed after every acknowledged user turn (Hermes-style); raise to batch turns.
agent.learning.fact-review-every-user-turns=${AGENT_LEARNING_FACT_REVIEW_EVERY_USER_TURNS:1}
agent.learning.maximum-input-chars=${AGENT_LEARNING_MAXIMUM_INPUT_CHARS:30000}
agent.learning.maximum-millis=${AGENT_LEARNING_MAXIMUM_MILLIS:120000}
agent.learning.maximum-model-turns=${AGENT_LEARNING_MAXIMUM_MODEL_TURNS:5}
agent.learning.maximum-output-tokens=${AGENT_LEARNING_MAXIMUM_OUTPUT_TOKENS:8192}
agent.learning.maximum-tool-calls=${AGENT_LEARNING_MAXIMUM_TOOL_CALLS:8}
agent.learning.maximum-total-tokens=${AGENT_LEARNING_MAXIMUM_TOTAL_TOKENS:100000}
agent.learning.skill-review-every-tool-iterations=${AGENT_LEARNING_SKILL_REVIEW_EVERY_TOOL_ITERATIONS:10}
# Empty runs reviews on the source task's pinned profile; name a configured profile to route them elsewhere.
agent.learning.profile=${AGENT_LEARNING_PROFILE:}
agent.learning.maximum-interaction-chars=${AGENT_LEARNING_MAXIMUM_INTERACTION_CHARS:6000}
agent.learning.maximum-review-interactions=${AGENT_LEARNING_MAXIMUM_REVIEW_INTERACTIONS:3}
agent.learning.maximum-consecutive-failures=${AGENT_LEARNING_MAXIMUM_CONSECUTIVE_FAILURES:2}
# off, on (counts) or verbose (one line per change): Slack thread notice after a review saves something.
agent.learning.notifications=${AGENT_LEARNING_NOTIFICATIONS:on}
# Completed fact reviews between derived-profile refreshes.
agent.learning.profile-review-every-fact-reviews=${AGENT_LEARNING_PROFILE_REVIEW_EVERY_FACT_REVIEWS:5}
# Days between curator reviews of the skill library; 0 disables the curator.
agent.learning.curator-every-days=${AGENT_LEARNING_CURATOR_EVERY_DAYS:7}

# Monitoring
# Generic persistent monitoring uses the existing scheduler and bounded agent runtime.
agent.monitoring.concurrent-runs=${AGENT_MONITORING_CONCURRENT_RUNS:4}
agent.monitoring.maximum-active-jobs=${AGENT_MONITORING_MAXIMUM_ACTIVE_JOBS:50}
agent.monitoring.minimum-cadence=${AGENT_MONITORING_MINIMUM_CADENCE:300s}
agent.monitoring.model-turns=${AGENT_MONITORING_MODEL_TURNS:20}
agent.monitoring.notification-chars=${AGENT_MONITORING_NOTIFICATION_CHARS:12000}
agent.monitoring.output-reserve=${AGENT_MONITORING_OUTPUT_RESERVE:16000}
agent.monitoring.results=${AGENT_MONITORING_RESULTS:50}
agent.monitoring.retained-runs=${AGENT_MONITORING_RETAINED_RUNS:100}
agent.monitoring.retention=${AGENT_MONITORING_RETENTION:90d}
agent.monitoring.run-duration=${AGENT_MONITORING_RUN_DURATION:5m}
agent.monitoring.tool-calls=${AGENT_MONITORING_TOOL_CALLS:20}
agent.monitoring.total-tokens=${AGENT_MONITORING_TOTAL_TOKENS:50000}

# Research and reports
# Research/report tools are independent of ingestion and scheduling; direct attachments do not require Chromium.
agent.research.enabled=${AGENT_RESEARCH_ENABLED:true}
agent.research.direct-fetch-enabled=${AGENT_RESEARCH_DIRECT_FETCH_ENABLED:true}
agent.research.allowed-hosts=${AGENT_RESEARCH_ALLOWED_HOSTS:}
# Expansion and extraction-timeout apply to passive non-PDF parsers; PDF settings are below.
agent.research.extraction-timeout=${AGENT_RESEARCH_EXTRACTION_TIMEOUT:20s}
agent.research.fetch-timeout=${AGENT_RESEARCH_FETCH_TIMEOUT:30s}
agent.research.max-archive-entries=${AGENT_RESEARCH_MAX_ARCHIVE_ENTRIES:256}
agent.research.max-artifacts=${AGENT_RESEARCH_MAX_ARTIFACTS:100}
agent.research.max-concurrent-downloads=${AGENT_RESEARCH_MAX_CONCURRENT_DOWNLOADS:2}
agent.research.max-expanded-bytes=${AGENT_RESEARCH_MAX_EXPANDED_BYTES:20971520}
agent.research.max-extracted-chars=${AGENT_RESEARCH_MAX_EXTRACTED_CHARS:1000000}
agent.research.max-redirects=${AGENT_RESEARCH_MAX_REDIRECTS:5}
agent.research.max-report-bytes=${AGENT_RESEARCH_MAX_REPORT_BYTES:262144}
agent.research.max-output-file-bytes=${AGENT_RESEARCH_MAX_OUTPUT_FILE_BYTES:10485760}
agent.research.max-task-requests=${AGENT_RESEARCH_MAX_TASK_REQUESTS:20}
agent.research.private-origins=${AGENT_RESEARCH_PRIVATE_ORIGINS:}

# Task file uploads
# Files the requester attaches to a task in the operator console or to a Slack message. They are stored with the
# task's research artifacts, read lazily through task_file_open/document_read, and available to code_run as input
# artifacts.
agent.uploads.enabled=${AGENT_UPLOADS_ENABLED:true}
agent.uploads.max-files=${AGENT_UPLOADS_MAX_FILES:10}
agent.uploads.max-file-bytes=${AGENT_UPLOADS_MAX_FILE_BYTES:10485760}
agent.uploads.max-total-bytes=${AGENT_UPLOADS_MAX_TOTAL_BYTES:26214400}

# Research file processing
# Supported files use the existing selected InferenceService; these settings only bound preprocessing and work.
# PDF preprocessing requires local Poppler executables. Rendering and inference are lazy; no model call at startup.
agent.research.files.max-output-chars-per-unit=${AGENT_RESEARCH_FILES_MAX_OUTPUT_CHARS_PER_UNIT:24000}
agent.research.files.max-page-image-bytes=${AGENT_RESEARCH_FILES_MAX_PAGE_IMAGE_BYTES:5242880}
agent.research.files.max-units=${AGENT_RESEARCH_FILES_MAX_UNITS:20}
agent.research.files.page-dimension=${AGENT_RESEARCH_FILES_PAGE_DIMENSION:1600}
agent.research.files.pdfinfo-command=${AGENT_RESEARCH_FILES_PDFINFO_COMMAND:pdfinfo}
agent.research.files.pdftotext-command=${AGENT_RESEARCH_FILES_PDFTOTEXT_COMMAND:pdftotext}
agent.research.files.render-command=${AGENT_RESEARCH_FILES_RENDER_COMMAND:pdftoppm}
agent.research.files.timeout=${AGENT_RESEARCH_FILES_TIMEOUT:90s}

# Account-owned credentials. Supply encryption keys through the ignored .env or process environment.
agent.secrets.enabled=${AGENT_SECRETS_ENABLED:true}
agent.secrets.key=${AGENT_SECRETS_KEY:}
agent.secrets.key-id=${AGENT_SECRETS_KEY_ID:primary}
agent.secrets.previous-keys=${AGENT_SECRETS_PREVIOUS_KEYS:}
agent.secrets.max-records=${AGENT_SECRETS_MAX_RECORDS:100}
agent.secrets.max-receipts=${AGENT_SECRETS_MAX_RECEIPTS:4096}
# Operator-managed USD estimates; public Standard rates verified on 2026-10-02 (GPT-6 Luna) and
# 2026-10-16 (Claude). Check the provider pricing pages before relying on these numbers.
# Exact model IDs; hosted rates are never fetched at runtime. The local example is explicitly priced at zero.
# Override the entire indexed list for other models or negotiated prices. Unlisted models remain unpriced.
usage.pricing-version=${USAGE_PRICING_VERSION:published-2026-10-16-local-zero}
# https://developers.openai.com/api/docs/models/gpt-6-luna
usage.prices[0].provider=openai
usage.prices[0].model=gpt-6-luna
usage.prices[0].input-per-million=0.10
usage.prices[0].output-per-million=0.50
usage.prices[0].cache-read-per-million=0.01
usage.prices[0].cache-creation-per-million=0.125
usage.prices[0].long-context.input-token-threshold=272000
usage.prices[0].long-context.input-multiplier=2
usage.prices[0].long-context.output-multiplier=1.5
# https://platform.claude.com/docs/en/about-claude/pricing
usage.prices[1].provider=claude
usage.prices[1].model=claude-haiku-4-5-20251001
usage.prices[1].input-per-million=1
usage.prices[1].output-per-million=5
usage.prices[1].cache-read-per-million=0.10
usage.prices[1].cache-creation5m-per-million=1.25
usage.prices[1].cache-creation1h-per-million=2
usage.prices[2].provider=claude
usage.prices[2].model=claude-haiku-5-5
usage.prices[2].input-per-million=0.10
usage.prices[2].output-per-million=0.50
usage.prices[2].cache-read-per-million=0.01
usage.prices[2].cache-creation5m-per-million=0.125
usage.prices[2].cache-creation1h-per-million=0.20
# Priced by prompt length: over 100,000 input tokens, cache reads and writes included, every rate
# is five times the base rate for the whole request.
usage.prices[2].long-context.input-token-threshold=100000
usage.prices[2].long-context.input-multiplier=5
usage.prices[2].long-context.output-multiplier=5
# Example zero cost for a self-hosted llama.cpp model, including every supported cache category. The model
# must equal the alias llama-server reports in responses (its --alias), not the gguf file name.
usage.prices[3].provider=llama-cpp
usage.prices[3].model=local-model
usage.prices[3].input-per-million=0
usage.prices[3].output-per-million=0
usage.prices[3].cache-read-per-million=0
usage.prices[3].cache-creation-per-million=0
usage.prices[3].cache-creation5m-per-million=0
usage.prices[3].cache-creation1h-per-million=0

# MCP SDK diagnostics can quote a remote server's messages; Velocity reports MCP failures by fixed codes instead.
logging.level.io.modelcontextprotocol=OFF

### Optional isolated Python computation (install the pinned runtime explicitly first).
agent.code-execution.enabled=${AGENT_CODE_EXECUTION_ENABLED:true}
agent.code-execution.image=${AGENT_CODE_EXECUTION_IMAGE:}
agent.code-execution.installation-id=${AGENT_CODE_EXECUTION_INSTALLATION_ID:}
agent.code-execution.docker-executable=${AGENT_CODE_EXECUTION_DOCKER_EXECUTABLE:docker}

# Web search (docs/web-search.md). The web_search tool queries the Tavily Search API; results are untrusted
# data and the tool never fetches result pages. Enabling it without an API key fails startup.
web-search.enabled=${WEB_SEARCH_ENABLED:true}
web-search.provider=${WEB_SEARCH_PROVIDER:tavily}
web-search.api-key=${TAVILY_API_KEY:}
web-search.base-url=${WEB_SEARCH_BASE_URL:https://api.tavily.com}
web-search.max-content-chars=${WEB_SEARCH_MAX_CONTENT_CHARS:2000}
web-search.max-results=${WEB_SEARCH_MAX_RESULTS:5}
web-search.request-timeout=${WEB_SEARCH_REQUEST_TIMEOUT:20s}
web-search.search-depth=${WEB_SEARCH_SEARCH_DEPTH:basic}

# MCP connector (docs/mcp.md). Registers the tools of operator-configured Model Context Protocol servers as
# mcp_<server>_<tool>. Servers are declared as an indexed list in .env or the environment, for example
# mcp.servers[0].name=docs, mcp.servers[0].transport=stdio, mcp.servers[0].command=npx.cmd,
# mcp.servers[0].args[0]=-y, mcp.servers[0].args[1]=@modelcontextprotocol/server-filesystem. Off by default;
# enabling it without a server entry fails startup, while an unreachable server is reported, not fatal.
mcp.enabled=${MCP_ENABLED:false}
mcp.connect-timeout=${MCP_CONNECT_TIMEOUT:30s}
mcp.request-timeout=${MCP_REQUEST_TIMEOUT:60s}
mcp.max-result-chars=${MCP_MAX_RESULT_CHARS:100000}
mcp.confirm-writes=${MCP_CONFIRM_WRITES:true}

# Tool approval (docs/agent-gateway.md#per-call-approval). When enabled, a tool call that can change state
# outside Velocity pauses the task until the operator approves or declines it in the console or the Slack thread.
agent.approval.enabled=${AGENT_APPROVAL_ENABLED:false}
# Tool categories that require approval; every registered category other than reads and questions is external.
agent.approval.categories=${AGENT_APPROVAL_CATEGORIES:browser.interaction,system.execute,network.write}
# Additional tool names that always require approval, and names exempted from category matching.
agent.approval.tools=${AGENT_APPROVAL_TOOLS:}
agent.approval.exempt-tools=${AGENT_APPROVAL_EXEMPT_TOOLS:}

# Live task output (docs/operator-api.md#live-task-events). Server-sent events push saved task changes to the
# console; model streaming additionally relays assistant text as it is generated on providers that stream.
agent.live-output.model-streaming=${AGENT_LIVE_OUTPUT_MODEL_STREAMING:true}

# Example feature module (docs/adding-a-feature.md). Packaged only with -Pexample-feature; off unless enabled.
example.enabled=${EXAMPLE_ENABLED:false}
